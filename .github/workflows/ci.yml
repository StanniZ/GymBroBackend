name: GymBroBackend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Build API image
        run: docker compose build api

      - name: Start PostgreSQL
        run: docker compose up -d --wait db

      - name: Run migrations and tests
        run: docker compose run --rm api sh -c "alembic upgrade head && python -m pytest -q -p no:cacheprovider"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::620759833456:role/github-actions-gymbro-ecr
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: >-
            ${{ steps.ecr.outputs.registry }}/gymbro-backend:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
